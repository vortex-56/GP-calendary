<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roomWoodWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="bedLinen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="500" fill="url(#roomWoodWall)"/>
  
  <!-- Wood wall planks -->
  <g stroke="#3b1502" stroke-width="2" opacity="0.4">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Large Glass Panoramic Window to Jungle -->
  <rect x="420" y="80" width="320" height="260" rx="6" fill="#14532d"/>
  <circle cx="560" cy="180" r="100" fill="#16a34a" opacity="0.8"/>
  <circle cx="680" cy="190" r="80" fill="#22c55e" opacity="0.7"/>
  <rect x="420" y="80" width="320" height="260" rx="6" fill="none" stroke="#78350f" stroke-width="12"/>
  <line x1="580" y1="80" x2="580" y2="340" stroke="#78350f" stroke-width="8"/>

  <!-- Sheer Curtains -->
  <path d="M420 80 Q 450 200 420 340 L 460 340 Q 480 200 450 80 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M740 80 Q 710 200 740 340 L 700 340 Q 680 200 710 80 Z" fill="#ffffff" opacity="0.3"/>

  <!-- King Size Bed -->
  <rect x="80" y="220" width="300" height="240" rx="8" fill="#78350f"/>
  <!-- Headboard -->
  <rect x="70" y="150" width="320" height="90" rx="6" fill="#92400e"/>
  <!-- Pillows -->
  <rect x="100" y="210" width="110" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="230" y="210" width="110" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="150" y="240" width="60" height="35" rx="6" fill="#1d9073"/>
  <rect x="230" y="240" width="60" height="35" rx="6" fill="#1d9073"/>

  <!-- White Fluffy Duvet -->
  <polygon points="85,260 375,260 390,460 70,460" fill="url(#bedLinen)"/>
  <!-- Green bed runner -->
  <polygon points="76,400 384,400 389,450 71,450" fill="#1d9073"/>

  <!-- Bedside Table and Lamp -->
  <g transform="translate(20, 280)">
    <rect x="0" y="40" width="55" height="90" rx="4" fill="#92400e"/>
    <!-- Warm Table Lamp -->
    <path d="M15 15 L40 15 L45 35 L10 35 Z" fill="#fef08a"/>
    <line x1="27" y1="35" x2="27" y2="45" stroke="#78350f" stroke-width="4"/>
    <circle cx="27" cy="25" r="28" fill="#fef08a" opacity="0.25"/>
  </g>

  <!-- Potted Amazonian Monstera Plant in Room -->
  <g transform="translate(360, 310)">
    <polygon points="20,130 50,130 55,80 15,80" fill="#d97706"/>
    <!-- Leaves -->
    <path d="M35 80 C 10 30 70 20 80 50 C 60 70 45 80 35 80 Z" fill="#15803d"/>
    <path d="M35 80 C -10 50 10 0 40 30 C 35 60 35 75 35 80 Z" fill="#22c55e"/>
  </g>

  <!-- Badge Label -->
  <rect x="30" y="30" width="280" height="38" rx="19" fill="#146d57" opacity="0.9"/>
  <text x="170" y="54" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">INTERIOR BUNGALOW SUITE</text>
</svg>
