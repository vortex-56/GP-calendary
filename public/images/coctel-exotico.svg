<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="loungeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="drinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#loungeBg)"/>

  <!-- Bokeh lights -->
  <circle cx="200" cy="150" r="45" fill="#f59e0b" opacity="0.15"/>
  <circle cx="600" cy="180" r="55" fill="#10b981" opacity="0.15"/>
  <circle cx="300" cy="220" r="35" fill="#ec4899" opacity="0.12"/>
  <circle cx="680" cy="260" r="40" fill="#38bdf8" opacity="0.1"/>

  <!-- Bar Counter surface -->
  <rect x="0" y="380" width="800" height="120" fill="#334155"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#64748b" stroke-width="3"/>

  <!-- Glass reflection shadow -->
  <ellipse cx="400" cy="385" rx="55" ry="12" fill="#000000" opacity="0.4"/>

  <!-- Cocktail Glass (Hurricane style) -->
  <path d="M375 140 C 375 240 350 280 395 350 L405 350 C 450 280 425 240 425 140 Z" fill="url(#drinkGrad)" opacity="0.9"/>
  <!-- Glass Stem and Base -->
  <rect x="396" y="350" width="8" height="30" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="400" cy="380" rx="35" ry="7" fill="#ffffff" opacity="0.6"/>

  <!-- Ice cubes inside -->
  <rect x="380" y="200" width="22" height="22" rx="4" fill="#ffffff" opacity="0.4" transform="rotate(15 380 200)"/>
  <rect x="390" y="260" width="20" height="20" rx="4" fill="#ffffff" opacity="0.4" transform="rotate(-20 390 260)"/>

  <!-- Tropical Garnish: Orange slice and Maracuyá -->
  <ellipse cx="425" cy="140" rx="28" ry="18" fill="#f97316"/>
  <ellipse cx="425" cy="140" rx="22" ry="14" fill="#fef08a"/>
  
  <!-- Mint leaf & paper umbrella -->
  <path d="M365 140 C 345 110 330 130 365 140 Z" fill="#22c55e"/>
  <path d="M365 140 C 355 100 375 110 365 140 Z" fill="#15803d"/>
  <!-- Eco bamboo straw -->
  <line x1="385" y1="90" x2="410" y2="300" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>

  <!-- Badge Label -->
  <rect x="30" y="30" width="280" height="38" rx="19" fill="#146d57" opacity="0.9"/>
  <text x="170" y="54" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">COCTELERÍA AMAZÓNICA</text>
</svg>
