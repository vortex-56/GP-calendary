<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJungle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="roofWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="wallWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="windowWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Jungle Background -->
  <rect width="800" height="500" fill="url(#bgJungle)"/>
  
  <!-- Lush Jungle Foliage silhouettes -->
  <g fill="#166534" opacity="0.7">
    <ellipse cx="100" cy="120" rx="90" ry="140" transform="rotate(-15 100 120)"/>
    <ellipse cx="720" cy="130" rx="100" ry="150" transform="rotate(20 720 130)"/>
    <circle cx="200" cy="80" r="90"/>
    <circle cx="600" cy="70" r="100"/>
  </g>

  <!-- Garden ground -->
  <path d="M0 360 Q 400 340 800 370 L800 500 L0 500 Z" fill="#14532d"/>
  
  <!-- Bungalow Stilt Foundation -->
  <rect x="220" y="340" width="16" height="70" rx="4" fill="#451a03"/>
  <rect x="350" y="340" width="16" height="70" rx="4" fill="#451a03"/>
  <rect x="470" y="340" width="16" height="70" rx="4" fill="#451a03"/>
  <rect x="580" y="340" width="16" height="70" rx="4" fill="#451a03"/>

  <!-- Bungalow Wooden Body -->
  <rect x="200" y="190" width="410" height="160" rx="4" fill="url(#wallWood)"/>
  <!-- Wooden planks horizontal lines -->
  <g stroke="#451a03" stroke-width="2" opacity="0.35">
    <line x1="200" y1="215" x2="610" y2="215"/>
    <line x1="200" y1="240" x2="610" y2="240"/>
    <line x1="200" y1="265" x2="610" y2="265"/>
    <line x1="200" y1="290" x2="610" y2="290"/>
    <line x1="200" y1="315" x2="610" y2="315"/>
    <line x1="200" y1="335" x2="610" y2="335"/>
  </g>

  <!-- Traditional Tropical High-pitch Roof -->
  <polygon points="160,200 405,80 650,200" fill="url(#roofWood)"/>
  <!-- Roof Overhang thatch details -->
  <polygon points="150,205 405,75 660,205 650,200 405,80 160,200" fill="#78350f"/>
  <g stroke="#9a3412" stroke-width="3" opacity="0.5">
    <line x1="200" y1="180" x2="405" y2="80"/>
    <line x1="270" y1="145" x2="405" y2="80"/>
    <line x1="340" y1="110" x2="405" y2="80"/>
    <line x1="470" y1="110" x2="405" y2="80"/>
    <line x1="540" y1="145" x2="405" y2="80"/>
    <line x1="610" y1="180" x2="405" y2="80"/>
  </g>

  <!-- Warm Windows -->
  <rect x="235" y="225" width="70" height="75" rx="4" fill="url(#windowWarm)"/>
  <rect x="235" y="225" width="70" height="75" rx="4" fill="none" stroke="#451a03" stroke-width="4"/>
  <line x1="270" y1="225" x2="270" y2="300" stroke="#451a03" stroke-width="3"/>
  <line x1="235" y1="262" x2="305" y2="262" stroke="#451a03" stroke-width="3"/>

  <!-- Balcony Door / Glass Entry -->
  <rect x="340" y="220" width="75" height="120" rx="3" fill="#ffffff" opacity="0.2"/>
  <rect x="340" y="220" width="75" height="120" rx="3" fill="none" stroke="#451a03" stroke-width="4"/>
  <rect x="348" y="230" width="28" height="50" fill="url(#windowWarm)"/>
  <rect x="380" y="230" width="28" height="50" fill="url(#windowWarm)"/>

  <!-- Balcony Terrace & Wooden Railing -->
  <rect x="180" y="335" width="450" height="15" rx="3" fill="#78350f"/>
  <!-- Balcony Railing -->
  <rect x="180" y="300" width="450" height="8" fill="#451a03"/>
  <g stroke="#451a03" stroke-width="3">
    <line x1="200" y1="300" x2="200" y2="335"/>
    <line x1="230" y1="300" x2="230" y2="335"/>
    <line x1="260" y1="300" x2="260" y2="335"/>
    <line x1="290" y1="300" x2="290" y2="335"/>
    <line x1="320" y1="300" x2="320" y2="335"/>
    <line x1="430" y1="300" x2="430" y2="335"/>
    <line x1="460" y1="300" x2="460" y2="335"/>
    <line x1="490" y1="300" x2="490" y2="335"/>
    <line x1="520" y1="300" x2="520" y2="335"/>
    <line x1="550" y1="300" x2="550" y2="335"/>
    <line x1="580" y1="300" x2="580" y2="335"/>
    <line x1="610" y1="300" x2="610" y2="335"/>
  </g>
  
  <!-- Hammock on Terrace -->
  <path d="M440 310 Q 510 345 580 310" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M440 310 L430 305" stroke="#78350f" stroke-width="3"/>
  <path d="M580 310 L590 305" stroke="#78350f" stroke-width="3"/>

  <!-- Tropical Plants in Foreground -->
  <g fill="#22c55e">
    <!-- Monstera leaves / heliconias -->
    <path d="M60 500 C 70 410 140 390 180 430 C 140 450 110 500 60 500 Z"/>
    <path d="M120 500 C 140 380 230 390 240 460 C 180 470 140 500 120 500 Z" fill="#15803d"/>
    <path d="M720 500 C 700 410 630 400 610 450 C 650 480 690 500 720 500 Z"/>
    <path d="M670 500 C 660 380 580 370 560 430 C 610 460 640 500 670 500 Z" fill="#16a34a"/>
  </g>

  <!-- Tropical Flowers -->
  <circle cx="170" cy="420" r="12" fill="#ef4444"/>
  <circle cx="620" cy="440" r="10" fill="#f97316"/>

  <!-- Badge Label -->
  <rect x="30" y="30" width="260" height="38" rx="19" fill="#146d57" opacity="0.9"/>
  <text x="160" y="54" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">BUNGALOWS FAMILIARES</text>
</svg>
