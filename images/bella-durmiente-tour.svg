<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sunsetSky)"/>

  <!-- Golden Sun -->
  <circle cx="480" cy="220" r="65" fill="url(#sunGrad)" opacity="0.9"/>

  <!-- Distant Clouds / Mist -->
  <path d="M0 260 Q 200 230 400 250 Q 600 230 800 260 L800 300 L0 300 Z" fill="#ffffff" opacity="0.45"/>

  <!-- Bella Durmiente Mountain Silhouette (The Sleeping Beauty of Tingo María) -->
  <!-- Outline of a woman lying down facing up: forehead, nose, lips, chin, neck, chest, knees -->
  <path d="M0 310 Q 70 290 140 280 C 180 280 200 240 230 235 C 245 233 260 215 275 220 C 290 225 310 205 325 210 C 340 215 360 250 380 255 C 410 260 450 220 500 225 C 550 230 590 280 630 285 C 690 290 750 260 800 290 L800 420 L0 420 Z" fill="#0f3e2b" opacity="0.8"/>

  <!-- Midground Mountains and Rainforest -->
  <path d="M0 330 Q 150 300 320 320 Q 520 290 800 340 L800 460 L0 460 Z" fill="#14532d"/>

  <!-- River Huallaga Curve -->
  <path d="M0 430 Q 250 400 500 420 Q 680 410 800 435 L800 500 L0 500 Z" fill="#0284c7" opacity="0.85"/>
  <path d="M0 445 Q 300 420 550 435 Q 700 425 800 450" stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Tropical Forest Canopy Foreground -->
  <g fill="#166534">
    <circle cx="60" cy="480" r="70"/>
    <circle cx="160" cy="490" r="60"/>
    <circle cx="720" cy="480" r="75"/>
  </g>

  <!-- Flying Birds / Amazonian Parrots -->
  <g fill="#1e293b" opacity="0.7">
    <path d="M220 160 Q 230 150 240 160 Q 250 150 260 160 Q 240 165 220 160 Z"/>
    <path d="M260 140 Q 268 132 276 140 Q 284 132 292 140 Q 276 144 260 140 Z"/>
    <path d="M200 175 Q 206 168 212 175 Q 218 168 224 175 Q 212 179 200 175 Z"/>
  </g>

  <!-- Badge Label -->
  <rect x="30" y="30" width="280" height="38" rx="19" fill="#146d57" opacity="0.9"/>
  <text x="170" y="54" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">MIRADOR BELLA DURMIENTE</text>
</svg>
