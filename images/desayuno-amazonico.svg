<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="morningLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="tableLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#morningLight)"/>
  
  <!-- Window terrace looking out to garden -->
  <path d="M0 0 L800 0 L800 250 L0 250 Z" fill="#bbf7d0" opacity="0.4"/>
  <circle cx="200" cy="120" r="90" fill="#22c55e" opacity="0.3"/>
  <circle cx="600" cy="100" r="110" fill="#16a34a" opacity="0.35"/>

  <!-- Balcony table -->
  <rect x="0" y="260" width="800" height="240" fill="url(#tableLight)"/>

  <!-- Coffee Mug -->
  <g transform="translate(180, 270)">
    <rect x="20" y="30" width="60" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Coffee dark fill -->
    <ellipse cx="50" cy="40" rx="25" ry="8" fill="#451a03"/>
    <!-- Mug handle -->
    <path d="M80 45 C 105 45 105 85 80 85" stroke="#ffffff" stroke-width="8" fill="none"/>
    <!-- Steam -->
    <path d="M45 20 Q 50 10 45 0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M55 22 Q 60 12 55 2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Tropical Fruit Platter (Papaya, Cocona, Plátano, Piña) -->
  <g transform="translate(330, 280)">
    <ellipse cx="120" cy="70" rx="105" ry="45" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Papaya slices -->
    <ellipse cx="90" cy="65" rx="35" ry="18" fill="#ea580c"/>
    <ellipse cx="90" cy="65" rx="20" ry="8" fill="#431407"/>
    <!-- Pineapple chunks -->
    <rect x="130" y="55" width="25" height="20" rx="3" fill="#eab308"/>
    <rect x="150" y="65" width="22" height="18" rx="3" fill="#facc15"/>
    <!-- Banana slice -->
    <circle cx="80" cy="80" r="10" fill="#fef08a"/>
    <circle cx="105" cy="82" r="10" fill="#fef08a"/>
  </g>

  <!-- Fresh Artisan Bread Basket -->
  <g transform="translate(560, 290)">
    <ellipse cx="70" cy="60" rx="60" ry="30" fill="#d97706" stroke="#b45309" stroke-width="3"/>
    <ellipse cx="55" cy="50" rx="20" ry="12" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="85" cy="52" rx="22" ry="14" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- Badge Label -->
  <rect x="30" y="30" width="280" height="38" rx="19" fill="#146d57" opacity="0.9"/>
  <text x="170" y="54" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">DESAYUNO AMAZÓNICO</text>
</svg>
