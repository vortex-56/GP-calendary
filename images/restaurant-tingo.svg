<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d150b"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e0c05"/>
    </linearGradient>
    <linearGradient id="plateWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#restBg)"/>

  <!-- Warm ambient light glow -->
  <circle cx="400" cy="180" r="240" fill="#f59e0b" opacity="0.15"/>
  <circle cx="400" cy="180" r="140" fill="#fbbf24" opacity="0.2"/>

  <!-- Wooden Tabletop -->
  <ellipse cx="400" cy="420" rx="380" ry="160" fill="url(#plateWood)"/>
  
  <!-- Banana Leaf under plate -->
  <path d="M180 340 C 240 260 520 250 620 320 C 580 430 250 440 180 340 Z" fill="#15803d"/>
  <path d="M190 335 Q 400 300 610 320" stroke="#86efac" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Large Artisan Ceramic Platter -->
  <ellipse cx="400" cy="340" rx="190" ry="85" fill="#fef3c7"/>
  <ellipse cx="400" cy="338" rx="175" ry="75" fill="#fde68a" stroke="#d97706" stroke-width="3"/>

  <!-- Food Elements: Tacacho Balls -->
  <circle cx="340" cy="330" r="35" fill="#d97706"/>
  <circle cx="330" cy="320" r="10" fill="#b45309" opacity="0.6"/>
  <circle cx="350" cy="335" r="8" fill="#78350f" opacity="0.6"/>

  <circle cx="400" cy="315" r="32" fill="#d97706"/>
  <circle cx="395" cy="310" r="9" fill="#92400e" opacity="0.7"/>

  <!-- Cecina ahumada slices (Amazonian Smoked Pork) -->
  <path d="M430 310 Q 480 300 500 320 Q 470 345 425 330 Z" fill="#991b1b"/>
  <path d="M440 330 Q 490 320 510 340 Q 470 365 435 345 Z" fill="#7f1d1d"/>

  <!-- Ensalada de Chonta (Palm Heart Salad) and Cocona chili -->
  <ellipse cx="370" cy="370" rx="25" ry="12" fill="#f8fafc"/>
  <ellipse cx="360" cy="375" rx="15" ry="8" fill="#f1f5f9"/>
  <!-- Cocona dipping bowl -->
  <circle cx="450" cy="370" r="18" fill="#ef4444"/>
  <circle cx="450" cy="370" r="14" fill="#f97316"/>

  <!-- Garnish herbs -->
  <path d="M380 330 Q 390 320 400 325" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <!-- Tropical Fruit juice glass in background -->
  <g transform="translate(560, 210)">
    <polygon points="20,130 50,130 55,50 15,50" fill="#f59e0b" opacity="0.85"/>
    <polygon points="15,50 55,50 60,30 10,30" fill="#ffffff" opacity="0.3"/>
    <line x1="38" y1="20" x2="25" y2="120" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Candle Lantern -->
  <g transform="translate(180, 230)">
    <rect x="20" y="30" width="30" height="45" rx="5" fill="#fef08a" opacity="0.6"/>
    <rect x="18" y="25" width="34" height="6" fill="#78350f"/>
    <rect x="18" y="75" width="34" height="6" fill="#78350f"/>
    <circle cx="35" cy="55" r="8" fill="#f59e0b"/>
  </g>

  <!-- Badge Label -->
  <rect x="30" y="30" width="280" height="38" rx="19" fill="#146d57" opacity="0.9"/>
  <text x="170" y="54" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">GASTRONOMÍA AMAZÓNICA</text>
</svg>
